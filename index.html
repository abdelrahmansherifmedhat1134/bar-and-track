<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://www.googleapis.com https://oauth2.googleapis.com https://accounts.google.com/gsi/ https://fonts.googleapis.com https://fonts.gstatic.com; frame-src https://accounts.google.com/gsi/; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'none'">
<title>Bar &amp; Track</title>
<meta name="description" content="Calisthenics and running training: return-to-training ramp, belt-weighted progression, run-walk ladder, GPS runs. Works offline.">
<meta name="theme-color" content="#eef1f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e141a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bar &amp; Track">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&amp;family=Barlow+Condensed:wght@500;600;700&amp;display=swap">
<link rel="stylesheet" href="css/app.css">
<link rel="modulepreload" href="js/main.js">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><i aria-hidden="true"></i><span>Bar &amp; Track</span></div>
    <button type="button" id="sync" class="pill" disabled>On this device</button>
  </header>
  <div id="updatebar" class="updatebar" hidden><span>A new version is ready.</span><button type="button" class="btn sm primary" data-act="reload">Update</button></div>
  <main id="main"><section class="card"><p class="small muted">Loading…</p></section></main>
  <noscript><section class="card"><p>Bar &amp; Track needs JavaScript enabled.</p></section></noscript>
</div>
<div id="restbar" role="timer" aria-live="polite" hidden><div class="in">
  <span class="tm" id="restTime">2:00</span><span class="lb" id="restLbl">Rest</span>
  <button type="button" data-act="rest" data-v="-15" aria-label="15 seconds less">−15</button>
  <button type="button" data-act="rest" data-v="15" aria-label="15 seconds more">+15</button>
  <button type="button" data-act="rest" data-v="skip">Skip</button>
</div></div>
<div id="sheet" hidden></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<nav class="tabs" aria-label="Main"><div class="in">
  <a href="#today" data-tab="today"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Today</a>
  <a href="#train" data-tab="train"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Train</a>
  <a href="#progress" data-tab="progress"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18"/><path d="M4 16l5-6 4 3 7-8"/></svg>Progress</a>
  <a href="#plan" data-tab="plan"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Plan</a>
</div></nav>
<script type="module" src="js/main.js"></script>
</body>
</html>
