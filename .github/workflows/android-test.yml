name: Android app test

# Runs the released APK on an Android emulator and checks the native parts end to end:
# bridge and plugins, Google sign-in response, run timer in the background with the screen off,
# lock-screen controls, scheduled cue alarms and GPS. Results are in the job summary; screenshots,
# logcat and results.json are uploaded as the "android-test" artifact.

on:
  workflow_run:
    workflows: ['Android app']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download the released APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/apk
          gh release download --repo "$GITHUB_REPOSITORY" --pattern bar-and-track.apk --dir /tmp/apk --clobber
          ls -l /tmp/apk

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: node app-android/test/run.mjs

      - name: Summary
        if: always()
        run: cat /tmp/bt-test/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test
          path: /tmp/bt-test
